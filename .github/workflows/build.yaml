name: build

on:
  push:
  schedule:
    - cron: 0 12 1 * *

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
    - run: npm ci
    - run: npm run lint
    - run: npm run build

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-12, windows-latest]
        repo:
          - casey/just
          - Michael-F-Bryan/mdbook-linkcheck
          - rossmacarthur/sheldon
          - rust-embedded/cross
          - rust-lang/mdBook
          - rustwasm/wasm-bindgen
          - sharkdp/hyperfine
        include:
          # rossmacarthur/powerpack only ships a macos binary
          - os: macos-latest
            repo: rossmacarthur/powerpack
        exclude:
          # rossmacarthur/sheldon does not ship a windows binary
          - os: windows-latest
            repo: rossmacarthur/sheldon

    runs-on: ${{ matrix.os }}
    name: test (${{matrix.os}}, ${{ matrix.repo }})
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Setup ${{ matrix.repo }}
      uses: ./
      with:
        repo: ${{ matrix.repo }}
      env:
        ACTIONS_STEP_DEBUG: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Test
      env:
        REPO: ${{ matrix.repo }}
      run: which $(printf '%s' "$REPO" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]')
      shell: bash

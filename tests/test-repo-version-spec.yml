name: Test repo with version specifier
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: casey/just@1.25
      - name: Assert just 1.25.x is installed
        shell: bash
        run: |
          OUT="$(just --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE '^just 1\.25\.[0-9]+'; then
            echo "FAIL: expected just 1.25.x"
            exit 1
          fi
          echo "PASS"

name: Test error when repo and owner are both provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: casey/just
          owner: casey
      - name: Assert action failed with conflict error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both 'repo' and 'owner' are provided, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both 'repo' and 'owner' were provided"

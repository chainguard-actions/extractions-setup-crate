name: Test deprecated owner/name/version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: casey
          name: just
          version: '1.x'
      - name: Assert just 1.x is installed and on PATH
        run: |
          echo "Checking if 'just' is available on PATH..."
          if ! command -v just >/dev/null 2>&1; then
            echo "FAIL: 'just' not found on PATH"
            exit 1
          fi
          VERSION=$(just --version)
          echo "just version: $VERSION"
          # Verify it's a 1.x version
          if ! echo "$VERSION" | grep -qE '^just 1\.'; then
            echo "FAIL: expected just 1.x but got: $VERSION"
            exit 1
          fi
          echo "PASS: just 1.x is installed via owner/name/version inputs"

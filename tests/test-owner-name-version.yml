name: Test deprecated owner/name/version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: sharkdp
          name: hyperfine
          version: '1.18.0'
      - name: Assert hyperfine 1.18.0 is installed
        shell: bash
        run: |
          OUT="$(hyperfine --version)"
          echo "actual: $OUT"
          if [ "$OUT" != "hyperfine 1.18.0" ]; then
            echo "FAIL: expected 'hyperfine 1.18.0'"
            exit 1
          fi
          echo "PASS"

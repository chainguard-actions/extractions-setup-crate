name: Test basic usage (latest casey/just)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: casey/just
      - name: Assert just is installed and on PATH
        shell: bash
        run: |
          which just || { echo "FAIL: just not on PATH"; exit 1; }
          OUT="$(just --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE '^just [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"

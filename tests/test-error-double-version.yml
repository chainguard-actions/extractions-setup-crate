name: Test error when version is specified in both repo and version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: casey/just@1.0
          version: '1.x'
      - name: Assert action failed with double version error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when version is specified in both 'repo' and 'version' input, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when version was specified twice"
